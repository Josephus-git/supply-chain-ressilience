[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyson-supply-chain"
version = "0.1.0"
description = "Research-grade ImportYeti extraction foundation for Dyson supply-chain research"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dyson-extract = "dyson_supply_chain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
