<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graph product search results</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { max-width: 1100px; margin: 0 auto; padding: 32px; background: #202124; color: #f1f3f4; }
    h1 { margin-bottom: 8px; }
    .query { color: #a8dadc; margin-bottom: 24px; }
    .answer, .result-card { background: #2b2d31; border: 1px solid #45474d; border-radius: 10px; padding: 18px; margin: 14px 0; }
    .answer { white-space: pre-wrap; line-height: 1.5; }
    .result-heading { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .rank { color: #d8a7ff; font-weight: bold; }
    .score { color: #9be7b1; }
    .field { margin-top: 12px; }
    .label { color: #a8dadc; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    .value { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
    .pill { display: inline-block; background: #3a3d44; border-radius: 999px; padding: 5px 9px; margin: 3px 4px 0 0; }
  </style>
</head>
<body>
  <h1>Graph product search</h1>
  <div class="query" id="query"></div>
  <section>
    <h2>Answer</h2>
    <div class="answer" id="answer"></div>
  </section>
  <section>
    <h2>Matching suppliers and shipments</h2>
    <main id="results"></main>
  </section>

  <script>
    const page = __PAGE_DATA__;
    document.querySelector('#query').textContent =
      `Product query: ${page.query} | Departure port: ${page.departure_port}`;
    document.querySelector('#answer').textContent = page.answer;

    const resultsContainer = document.querySelector('#results');
    if (page.results.length === 0) {
      resultsContainer.textContent = 'No matching suppliers were found.';
    } else {
      page.results.forEach((result) => {
        const card = document.createElement('article');
        card.className = 'result-card';

        const heading = document.createElement('div');
        heading.className = 'result-heading';
        const rank = document.createElement('span');
        rank.className = 'rank';
        rank.textContent = `#${result.rank}`;
        const score = document.createElement('span');
        score.className = 'score';
        score.textContent = `Similarity: ${Number(result.similarity_score || 0).toFixed(4)}`;
        heading.append(rank, score);

        const fields = [
          ['Supplier', result.supplier],
          ['Product', result.product_description],
          ['HS description', result.full_hs_code_description],
          ['Departure port', result.departure_port],
          ['Shipment count', result.shipment_count],
        ];

        card.appendChild(heading);
        fields.forEach(([label, value]) => {
          const field = document.createElement('div');
          field.className = 'field';
          const labelElement = document.createElement('div');
          labelElement.className = 'label';
          labelElement.textContent = label;
          const valueElement = document.createElement('div');
          valueElement.className = 'value';
          valueElement.textContent = value ?? 'Not available';
          field.append(labelElement, valueElement);
          card.appendChild(field);
        });

        const arrivalField = document.createElement('div');
        arrivalField.className = 'field';
        const arrivalLabel = document.createElement('div');
        arrivalLabel.className = 'label';
        arrivalLabel.textContent = 'Arrival ports';
        arrivalField.appendChild(arrivalLabel);
        (result.arrival_ports || []).forEach((port) => {
          const pill = document.createElement('span');
          pill.className = 'pill';
          pill.textContent = port;
          arrivalField.appendChild(pill);
        });
        card.appendChild(arrivalField);
        resultsContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
