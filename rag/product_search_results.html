<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product search results</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { max-width: 960px; margin: 0 auto; padding: 32px; background: #202124; color: #f1f3f4; }
    h1 { margin-bottom: 8px; }
    .query { color: #a8dadc; margin-bottom: 24px; }
    .result-card { background: #2b2d31; border: 1px solid #45474d; border-radius: 10px; padding: 18px; margin: 14px 0; }
    .result-heading { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .rank { color: #d8a7ff; font-weight: bold; }
    .score { color: #9be7b1; }
    .field { margin-top: 14px; }
    .label { color: #a8dadc; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
    .value { white-space: pre-wrap; overflow-wrap: anywhere; color: #e8eaed; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Product search results</h1>
  <div class="query" id="query"></div>
  <main id="results"></main>

  <script>
    const query = "equipment used to filter and purify air in buildings";
    const results = [{"rank": 1, "score": 0.6944602131843567, "full_hs_code_description": "Electrical machinery and equipment and parts thereof; sound recorders and reproducers, television image and sound recorders and reproducers, and parts and accessories of such articles ; Electrical apparatus for switching or protecting electrical circuits, or for making connections to or in electrical circuits (for example, switches, relays, fuses, surge suppressors, plugs, sockets, lamp-holders and other connectors, junction boxes), for a voltage not exceeding 1,000 V; connectors for optical fibers, optical fiber bundles or cables ; Other switches", "product_description": "Activated Carbon Filter Retail"}, {"rank": 2, "score": 0.6821166276931763, "full_hs_code_description": "Nuclear reactors, boilers, machinery and mechanical appliances; parts thereof ; Air or vacuum pumps, air or other gas compressors and fans; ventilating or recycling hoods incorporating a fan, whether or not fitted with filters; gas-tight biological safety cabinets, whether or not fitted with filters; parts thereof ; Fans ; Other", "product_description": "Hand Dryer"}, {"rank": 3, "score": 0.6717211604118347, "full_hs_code_description": "Nuclear reactors, boilers, machinery and mechanical appliances; parts thereof ; Air or vacuum pumps, air or other gas compressors and fans; ventilating or recycling hoods incorporating a fan, whether or not fitted with filters; gas-tight biological safety cabinets, whether or not fitted with filters; parts thereof ; Parts", "product_description": "Electronics Spare Accessorieshs Vacuum Cleaner Hairdryer Spare"}, {"rank": 4, "score": 0.6664375066757202, "full_hs_code_description": "Nuclear reactors, boilers, machinery and mechanical appliances; parts thereof ; Air or vacuum pumps, air or other gas compressors and fans; ventilating or recycling hoods incorporating a fan, whether or not fitted with filters; gas-tight biological safety cabinets, whether or not fitted with filters; parts thereof ; Fans ; Table, floor, wall, window, ceiling or roof fans, with a self-contained electric motor of an output not exceeding 125 W", "product_description": "Fan Pallet Free All Freightprepaid Including Destination Charges"}, {"rank": 5, "score": 0.6596056222915649, "full_hs_code_description": "Nuclear reactors, boilers, machinery and mechanical appliances; parts thereof ; Machines and mechanical appliances having individual functions, not specified or included elsewhere in this chapter; parts thereof ; Parts", "product_description": "Electrostatic Filter Retail Ceva Hbl Jhb Scac Pymn"}];
    document.querySelector('#query').textContent = `Query: ${query}`;

    const resultsContainer = document.querySelector('#results');
    if (results.length === 0) {
      resultsContainer.textContent = 'No matching products found.';
    } else {
      results.forEach((result) => {
        const card = document.createElement('article');
        card.className = 'result-card';

        const heading = document.createElement('div');
        heading.className = 'result-heading';

        const rank = document.createElement('span');
        rank.className = 'rank';
        rank.textContent = `#${result.rank}`;

        const score = document.createElement('span');
        score.className = 'score';
        score.textContent = `Similarity: ${result.score.toFixed(4)}`;

        const hsDescription = document.createElement('div');
        hsDescription.className = 'field';
        hsDescription.innerHTML = '<div class="label">Full HS code description</div>';
        const hsValue = document.createElement('div');
        hsValue.className = 'value';
        hsValue.textContent = result.full_hs_code_description || 'Not available';
        hsDescription.appendChild(hsValue);

        const productDescription = document.createElement('div');
        productDescription.className = 'field';
        productDescription.innerHTML = '<div class="label">Product description</div>';
        const productValue = document.createElement('div');
        productValue.className = 'value';
        productValue.textContent = result.product_description || 'Not available';
        productDescription.appendChild(productValue);

        heading.append(rank, score);
        card.append(heading, hsDescription, productDescription);
        resultsContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
